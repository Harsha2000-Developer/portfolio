# Production server for the static build. Runs as non-root on port 8080 (nginx-unprivileged).
# Security headers live in security-headers.conf. nginx drops server-level add_header
# directives inside any location that sets its own, so each location includes them.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # Fingerprinted build assets: cache for a year, never revalidate.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Liveness probe for load balancers / Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML and other un-hashed files: always revalidate so deploys show up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
