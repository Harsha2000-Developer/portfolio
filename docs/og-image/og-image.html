<!doctype html>
<!-- Source for public/og-image.png (1200x630). Re-render with headless Chrome after changing it; see README. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;width:1200px;height:630px;background:#0a0e1a;color:#e6eaf2;font-family:Inter,sans-serif;position:relative;overflow:hidden}
  .glow{position:absolute;width:900px;height:900px;right:-300px;top:-400px;background:radial-gradient(circle,rgba(129,140,248,.25),transparent 65%)}
  .wrap{position:absolute;inset:0;padding:80px 90px;display:flex;flex-direction:column;justify-content:center}
  .tag{font-family:'JetBrains Mono',monospace;color:#38bdf8;font-size:24px;letter-spacing:3px;text-transform:uppercase}
  h1{font-size:92px;line-height:1.02;letter-spacing:-3px;font-weight:800;margin:22px 0 26px}
  h1 span{background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;color:transparent}
  p{font-size:32px;color:#8b96ad;margin:0;font-weight:500}
  .bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#38bdf8,#818cf8)}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="tag">Senior Software Engineer</div>
    <h1><span>Sri Harsha<br>Godavarthi</span></h1>
    <p>Java · Spring Boot · React · AWS · Kubernetes</p>
  </div>
  <div class="bar"></div>
</body>
</html>
